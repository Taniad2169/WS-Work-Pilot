<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwanDesk AI · WorkPilot</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://swandesk-ai.netlify.app/img/ws-logo.png">
<link rel="stylesheet" href="https://swandesk-ai.netlify.app/style.css">
<style>
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .cl { border-radius: 14px; border: 1px solid var(--line); padding: 14px; background: #fff; }
  .cl[data-color="orange"] { background: #fff3e6; border-color: #ffbf7a; }
  .cl[data-color="lavender"] { background: #f2ecfb; border-color: #c9b3ef; }
  .cl[data-color="sky"] { background: #e9f6fd; border-color: #93e5fa; }
  .cl[data-color="lightgreen"] { background: #eefaf0; border-color: #9fe3af; }
  .swatches { display: flex; gap: 6px; margin: 6px 0; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .sw[data-c="orange"] { background: #ffb15c; } .sw[data-c="lavender"] { background: #b89af0; } .sw[data-c="sky"] { background: #6cd0ef; } .sw[data-c="lightgreen"] { background: #74d98a; } .sw[data-c=""] { background: #e5eaf0; }
  .agrow { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
  .task { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .task.done span { text-decoration: line-through; color: var(--muted); }
  .navlinks { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  textarea.note { min-height: 56px; font-size: .85rem; }
</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  // Same Firebase project as SwanDesk AI and The WebSwan's own WorkPilot (webswan-gigoia-task) -- this page is
  // served from taniad2169.github.io, already an authorized domain for that project (daily-task runs there too),
  // so Google sign-in works here with no extra Firebase Console step.
  const app = initializeApp({ apiKey: "AIzaSyBxuPZnF8rSZPkmoeqNR_9PQtFUJNKU3JM", authDomain: "webswan-gigoia-task.firebaseapp.com", projectId: "webswan-gigoia-task", appId: "1:970866236717:web:63ddb5c2557d083b8bc7a4" });
  const auth = getAuth(app);
  const API_BASE = "https://swandesk-ai.netlify.app/.netlify/functions/";
  window.SD = {
    async signIn() {
      const p = new GoogleAuthProvider();
      if (/Android|iPhone|iPad|iPod|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent)) return signInWithRedirect(auth, p);
      try { return await signInWithPopup(auth, p); }
      catch (e) { if (/popup-blocked|operation-not-supported|web-storage-unsupported/.test(String(e && e.code))) return signInWithRedirect(auth, p); throw e; }
    },
    signOut: () => signOut(auth),
    user: () => auth.currentUser,
    async api(fn, body) {
      const tok = auth.currentUser ? await auth.currentUser.getIdToken() : "";
      const r = await fetch(API_BASE + fn, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok }, body: JSON.stringify(body || {}) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Something went wrong (" + r.status + ")");
      return j;
    }
  };
  getRedirectResult(auth).catch((e) => window.dispatchEvent(new CustomEvent("sd-auth-error", { detail: { message: e.message } })));
  onAuthStateChanged(auth, (u) => window.dispatchEvent(new CustomEvent("sd-auth", { detail: { user: u } })));
</script>
</head>
<body>
<header class="top">
  <img src="https://swandesk-ai.netlify.app/img/ws-logo.png" alt="WebSwan">
  <div><h1>SwanDesk AI · WorkPilot</h1><small>WebSwan Digital Solutions</small></div>
  <span class="sp"></span>
  <span id="who" style="font-size:.85rem"></span><button class="btn wh" id="outBtn" hidden>Sign out</button>
</header>

<div id="gate" class="card gate"><h2>WorkPilot</h2><p class="muted">Sign in with thewebswann@gmail.com.</p><button class="btn" id="inBtn">Sign in with Google</button><p id="gateMsg" class="muted" role="alert"></p></div>

<main class="wrap" id="app" hidden>
  <div class="navlinks">
    <a class="btn ghost" href="https://swandesk-ai.netlify.app/admin/" target="_blank" rel="noopener noreferrer">SwanDesk AI Admin</a>
    <a class="btn ghost" href="https://taniad2169.github.io/daily-task/" target="_blank" rel="noopener noreferrer">The WebSwan's WorkPilot</a>
    <a class="btn ghost" href="https://taniad2169.github.io/webswan-dagigoia-task/voice-studio/" target="_blank" rel="noopener noreferrer">Voice Studio</a>
  </div>

  <section class="card">
    <h2>To-do</h2>
    <div class="row"><div class="f" style="flex:1"><input id="taskNew" placeholder="Add a task..."></div><div class="f" style="flex:0"><button class="btn" id="taskAdd">Add</button></div></div>
    <div id="tasks"></div>
  </section>

  <section class="card">
    <h2>Clients <span class="muted" id="countTxt"></span></h2>
    <div class="board" id="board"><p class="muted">Loading...</p></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const toast = (t) => { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", 4000); };
let D = null;
const STATE_HELP = { locked: "Not purchased", active: "On", paused: "Paused", suspended: "Suspended" };

function clientCard(c) {
  return `<div class="cl" data-id="${c.id}" data-color="${esc(c.color || "")}">
    <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
      <div><b style="font-size:1.05rem">${esc(c.business || "(no name)")}</b><br><span class="muted">${esc(c.industry || "")} ${c.ownerName ? "· " + esc(c.ownerName) : ""}</span><br><span class="muted">${esc((c.emails || []).join(", "))}</span></div>
      <label class="switch" style="font-size:.78rem" title="Turn off for non-payment"><input type="checkbox" class="acc" ${c.status === "active" ? "checked" : ""}></label>
    </div>
    <div class="swatches">${["", "orange", "lavender", "sky", "lightgreen"].map((cc) => `<span class="sw" data-c="${cc}" title="${cc || "none"}" style="${c.color === cc ? "outline:2px solid #0b2f57" : ""}"></span>`).join("")}</div>
    ${Object.entries(D.agents).map(([k, a]) => `<div class="agrow"><span>${esc(a.name)}</span><select class="ag" data-a="${k}">${D.states.map((s) => `<option value="${s}" ${c.agents[k] && c.agents[k].state === s ? "selected" : ""}>${STATE_HELP[s]}</option>`).join("")}</select></div>`).join("")}
    <textarea class="note" placeholder="WorkPilot note (yours only, never touches the client's real record)">${esc(c.note || "")}</textarea>
    <button class="btn ghost sm noteSave" style="margin-top:6px">Save note</button>
  </div>`;
}
function drawBoard() {
  $("countTxt").textContent = D.clients.length ? "(" + D.clients.length + ")" : "";
  $("board").innerHTML = D.clients.length ? D.clients.map(clientCard).join("") : '<p class="muted">No SwanDesk clients yet -- create one in SwanDesk AI Admin.</p>';
  document.querySelectorAll(".cl").forEach((card) => {
    const id = card.dataset.id;
    const act = async (body) => { try { await SD.api("sd-workpilot", Object.assign({ id }, body)); toast("Saved"); load(); } catch (e) { toast(e.message); load(); } };
    card.querySelector(".acc").onchange = (e) => { if (!e.target.checked && !confirm("Turn this account OFF for non-payment? All of their agents stop until turned back on.")) { e.target.checked = true; return; } act({ action: "account", on: e.target.checked }); };
    card.querySelectorAll(".ag").forEach((s) => s.onchange = () => act({ action: "agent", agent: s.dataset.a, state: s.value }));
    card.querySelectorAll(".sw").forEach((s) => s.onclick = () => act({ action: "note_save", color: s.dataset.c, note: card.querySelector(".note").value }));
    card.querySelector(".noteSave").onclick = () => act({ action: "note_save", color: card.dataset.color || "", note: card.querySelector(".note").value });
  });
}
function drawTasks() {
  $("tasks").innerHTML = (D.tasks || []).length ? D.tasks.map((t) => `<div class="task ${t.done ? "done" : ""}" data-id="${t.id}"><input type="checkbox" class="tDone" ${t.done ? "checked" : ""}><span>${esc(t.text)}</span><span class="sp" style="flex:1"></span><button class="btn ghost sm tDel">x</button></div>`).join("") : '<p class="muted">No tasks yet.</p>';
  document.querySelectorAll(".task").forEach((row) => {
    const id = row.dataset.id;
    row.querySelector(".tDone").onchange = async (e) => { await SD.api("sd-workpilot", { action: "task_done", id, done: e.target.checked }); load(); };
    row.querySelector(".tDel").onclick = async () => { await SD.api("sd-workpilot", { action: "task_delete", id }); load(); };
  });
}
async function load() {
  try { D = await SD.api("sd-workpilot", { action: "list" }); drawBoard(); drawTasks(); }
  catch (e) { $("board").innerHTML = '<p class="banner">' + esc(e.message) + '</p>'; }
}
$("taskAdd").onclick = async () => { const t = $("taskNew").value.trim(); if (!t) return; await SD.api("sd-workpilot", { action: "task_save", text: t }); $("taskNew").value = ""; load(); };
$("taskNew").onkeydown = (e) => { if (e.key === "Enter") $("taskAdd").click(); };
$("inBtn").onclick = () => SD.signIn().catch((e) => $("gateMsg").textContent = e.message);
$("outBtn").onclick = () => SD.signOut();
window.addEventListener("sd-auth-error", (e) => $("gateMsg").textContent = e.detail.message);
window.addEventListener("sd-auth", (e) => {
  const u = e.detail.user;
  $("gate").hidden = !!u; $("app").hidden = !u; $("outBtn").hidden = !u;
  if (u) { $("who").textContent = u.email; load(); }
  else if (!$("gateMsg").textContent) $("gateMsg").textContent = "";
});
</script>
</body>
</html>
